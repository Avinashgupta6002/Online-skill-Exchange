<!-- NAVBAR -->
<nav id="navbar" class="fixed top-0 w-full z-50 transition-all duration-300">

    <div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-4">

        <!-- LOGO -->
        <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">
            SkillX
        </h1>

        <!-- DESKTOP MENU -->
        <div class="hidden md:flex space-x-8 items-center">

            <a href="{% url 'home' %}" class="nav-link">Home</a>
            <a href="{% url 'about' %}" class="nav-link">About</a>
            <a href="{% url 'services' %}" class="nav-link">Services</a>
            <a href="#" class="nav-link">Explore</a>

            <!-- Buttons -->
            <a href="{% url 'login' %}" class="btn-outline">Login</a>
            <a href="#" class="btn-primary">Join Now</a>

        </div>

        <!-- MOBILE MENU BUTTON -->
        <button id="menu-btn" class="md:hidden text-white text-2xl">
            ☰
        </button>

    </div>

    <!-- MOBILE MENU -->
    <div id="mobile-menu" class="hidden md:hidden flex-col bg-black text-white px-6 pb-4 space-y-3">

        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'services' %}">Services</a>
        <a href="#">Explore</a>

        <a href="#" class="btn-outline text-center">Login</a>
        <a href="#" class="btn-primary text-center">Join Now</a>

    </div>

</nav>

<script>
/* Scroll effect */
window.addEventListener("scroll", function() {
    let nav = document.getElementById("navbar");
    if (window.scrollY > 50) {
        nav.classList.add("bg-black", "shadow-lg");
    } else {
        nav.classList.remove("bg-black", "shadow-lg");
    }
});

/* Mobile toggle */
document.getElementById("menu-btn").addEventListener("click", function() {
    document.getElementById("mobile-menu").classList.toggle("hidden");
});
</script>
